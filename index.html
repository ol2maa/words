<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>خمّن الكلمة</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    min-height:100%;
    background:#050b18;
    color:#f5faff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;
}

body{
    display:flex;
    justify-content:center;
    overflow-x:hidden;
    touch-action:manipulation;
}

#game-container{
    width:min(100%,440px);
    min-height:100svh;
    padding:
        max(8px,env(safe-area-inset-top))
        12px
        max(10px,env(safe-area-inset-bottom));
    position:relative;
    background:#050b18;
}

/* إغلاق */
#close-btn{
    position:absolute;
    top:max(5px,env(safe-area-inset-top));
    right:8px;
    width:42px;
    height:42px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#f5faff;
    font-size:31px;
    line-height:1;
    opacity:.85;
    z-index:20;
    cursor:pointer;
}

/* الفئات */
#category-row{
    display:flex;
    justify-content:center;
    gap:6px;
    margin:47px 0 7px;
}

.cat-btn{
    flex:1;
    max-width:82px;
    height:40px;
    background:#0a2650;
    border:1px solid #1a4d7a;
    border-radius:11px;
    color:#f5faff;
    font-size:14px;
    font-weight:800;
    cursor:pointer;
    transition:all 0.15s;
}

.cat-btn:active{
    transform:scale(0.95);
}

.cat-btn.active{
    background:#fcc700;
    border-color:#fcc700;
    color:#050b18;
}

#selected-category-label{
    color:#fcc700;
    font-size:16px;
    font-weight:800;
    text-align:center;
    margin:3px 0 7px;
}

/* شبكة 5 × 4 */
#grid-wrapper{
    display:flex;
    justify-content:center;
    margin:0 auto 7px;
}

#grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:6px;
    width:min(290px,78vw);
}

.cell{
    width:100%;
    aspect-ratio:1;
    background:#0e1b2e;
    border:2px solid #1a4d7a;
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    font-weight:800;
    color:#f5faff;
    transition:background 0.2s,border-color 0.2s;
}

.cell.green{
    background:#05b84d;
    border-color:#05b84d;
}

.cell.orange{
    background:#f57a00;
    border-color:#f57a00;
}

.cell.gray{
    background:#4d5566;
    border-color:#4d5566;
}

/* الإحصائيات */
#panels-row{
    display:flex;
    gap:8px;
    margin:5px 0 6px;
}

.panel{
    flex:1;
    background:#081224;
    border:1px solid #1a4d7a;
    border-radius:14px;
    padding:7px 3px;
    text-align:center;
    min-height:88px;
}

.panel-title{
    color:#fcc700;
    font-size:15px;
    font-weight:800;
    margin-bottom:2px;
}

.panel-sub{
    color:#f5faff;
    font-size:11px;
    line-height:1.45;
}

.panel-value{
    color:#fcc700;
    font-size:18px;
    font-weight:800;
    line-height:1.2;
}

/* الأزرار */
#controls-row{
    display:flex;
    gap:8px;
    margin:4px 0 6px;
}

.ctrl-btn{
    flex:1;
    height:44px;
    border-radius:12px;
    font-size:16px;
    font-weight:800;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    border:none;
    transition:transform 0.1s;
}

.ctrl-btn:active{
    transform:scale(0.95);
}

.ctrl-btn.reset{
    background:#0a4b8a;
    color:#f5faff;
}

.ctrl-btn.backspace{
    background:#36414f;
    color:#f5faff;
}

/* لوحة الحروف */
#keyboard{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    margin:5px 0 6px;
}

.kb-row{
    display:flex;
    justify-content:center;
    gap:4px;
    width:100%;
}

.kb-key{
    width:clamp(29px,8.1vw,37px);
    height:37px;
    padding:0;
    background:#0d1f33;
    border:1px solid #1a4d7a;
    border-radius:7px;
    color:#f5faff;
    font-size:16px;
    font-weight:800;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:all 0.15s;
}

.kb-key:active{
    transform:scale(0.92);
}

.kb-key.used-wrong{
    background:#2a333f;
    color:#7a8496;
    border-color:#2a333f;
}

.kb-key.used-correct{
    background:#0c7a33;
    border-color:#0c7a33;
    color:#f5faff;
}

.kb-key.used-present{
    background:#c97a00;
    border-color:#c97a00;
    color:#fff;
}

/* دليل الألوان */
#guide{
    background:#081224;
    border:1px solid #1a4d7a;
    border-radius:12px;
    min-height:48px;
    padding:5px 6px;
    display:flex;
    justify-content:space-around;
    align-items:center;
    gap:3px;
}

.guide-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:#f5faff;
    font-size:9px;
    font-weight:700;
    text-align:center;
    line-height:1.1;
}

.guide-swatch{
    width:16px;
    height:16px;
    border-radius:4px;
    margin-bottom:2px;
}

/* رسالة وسط الشاشة */
#message-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:50;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s;
}

#message-overlay.show{
    opacity:1;
    pointer-events:auto;
}

#message-box{
    width:min(380px,90vw);
    background:#081224;
    border:2px solid #fcc700;
    border-radius:16px;
    padding:18px 22px;
    text-align:center;
}

#message-title{
    color:#fcc700;
    font-size:21px;
    font-weight:800;
}

#message-sub{
    color:#f5faff;
    font-size:14px;
    font-weight:700;
    line-height:1.6;
    margin-top:6px;
}

/* شاشات الآيفون القصيرة */
@media (max-height:760px){
    #category-row{margin-top:40px}
    #grid{width:min(260px,73vw);gap:5px}
    .cell{font-size:21px}
    .panel{min-height:76px;padding:5px 2px}
    .panel-title{font-size:13px}
    .panel-sub{font-size:10px}
    .panel-value{font-size:16px}
    .ctrl-btn{height:40px;font-size:14px}
    .kb-key{height:33px;font-size:14px}
    #guide{min-height:42px}
    .guide-item{font-size:8px}
    .guide-swatch{width:13px;height:13px}
}

/* شاشات صغيرة جداً */
@media (max-width:370px){
    #game-container{padding-left:8px;padding-right:8px}
    #category-row{gap:4px}
    .cat-btn{font-size:12px;height:37px}
    #selected-category-label{font-size:14px}
    #grid{width:min(245px,72vw)}
    .kb-key{width:27px;height:32px;font-size:13px}
}
</style>
</head>

<body>
<div id="game-container">

    <div id="close-btn" aria-label="إغلاق">×</div>

    <div id="category-row">
        <button class="cat-btn active" data-cat="الكل">الكل</button>
        <button class="cat-btn" data-cat="بلدان">بلدان</button>
        <button class="cat-btn" data-cat="أكل">أكل</button>
        <button class="cat-btn" data-cat="حيوانات">حيوانات</button>
    </div>

    <div id="selected-category-label">الفئة: الكل</div>

    <div id="grid-wrapper">
        <div id="grid"></div>
    </div>

    <div id="panels-row">
        <div class="panel">
            <div class="panel-title">الإحصائيات</div>
            <div class="panel-sub" id="win-ratio">نسبة الفوز: 0.0%</div>
            <div class="panel-sub" id="win-count">الفوز: 0</div>
            <div class="panel-sub" id="games-played">لعبت: 0/3</div>
            <div class="panel-sub" id="highest-score">أعلى نقاط: 0</div>
        </div>

        <div class="panel">
            <div class="panel-title" id="game-number">اللعبة 1/3</div>
            <div class="panel-sub">الحركات</div>
            <div class="panel-value" id="move-count">0</div>
            <div class="panel-sub">النقاط</div>
            <div class="panel-value" id="score-display">0</div>
        </div>
    </div>

    <div id="controls-row">
        <button class="ctrl-btn reset" id="reset-btn">إعادة ↻</button>
        <button class="ctrl-btn backspace" id="backspace-btn">حذف ⌫</button>
    </div>

    <div id="keyboard"></div>

    <div id="guide">
        <div class="guide-item">
            <span class="guide-swatch" style="background:#05b84d"></span>
            صحيح
        </div>
        <div class="guide-item">
            <span class="guide-swatch" style="background:#f57a00"></span>
            موجود بمكان آخر
        </div>
        <div class="guide-item">
            <span class="guide-swatch" style="background:#4d5566"></span>
            غير موجود
        </div>
    </div>
</div>

<div id="message-overlay">
    <div id="message-box">
        <div id="message-title"></div>
        <div id="message-sub"></div>
    </div>
</div>

<script>
'use strict';

// ============================================================
// قوائم الكلمات
// ============================================================
const ANIMALS = [
    'خروف','حمار','حصان','ثعلب','بقرة','ماعز','ناقة','سنور','طائر','غراب',
    'بومة','نحلة','نملة','دبور','عقرب','سمكة','سمور','حوتة','أسود','ذئاب',
    'نمور','فيلة','قرود','جمال','دجاج','كلبة','لبوة','قردة','فهدة','نمرة','بجعة'
];

const FOODS = [
    'تفاح','بطيخ','رمان','لبنة','جبنة','فلفل','خيار','سمسم','طماط','طحين',
    'زبدة','شعير','مربى','حساء','كعكة','عجوة','موزة','لوزة','جوزة','خبزة',
    'رغيف','برغل','قهوة','حليب','زبيب','عدسة','حمصة','فولة','بطاط'
];

const COUNTRIES = [
    'عمان','مالي','تشاد','تونس','غانا','بنين','نيجر','كوبا','بيرو','لاوس','توغو','عراق'
];

const GENERAL = [
    'كتاب','ريال','منزل','شارع','جوال','مطبخ','مكيف','كراج','ساعة','بابا',
    'عندي','بيتي','قلبي','روحي','عيني','نفسي','دنيا','نجمة','سحاب','طريق',
    'مكتب','سرير','هاتف','جدار','لعبة','حاسب','جهاز','صباح','مساء','جميل',
    'كبير','سريع','بطيء','قريب','دفتر','صورة','غرفة','حجرة','نادي','كرسي',
    'ليلة','بحري','نهري','جبال','حائط','طعام','سماء','أرضي'
];

// ============================================================
// دوال مساعدة
// ============================================================
function fourLetters(list){
    return [...new Set(list.filter(w => [...w].length === 4))];
}

const WORDS = {
    'الكل': fourLetters([...ANIMALS,...FOODS,...COUNTRIES,...GENERAL]),
    'بلدان': fourLetters(COUNTRIES),
    'أكل': fourLetters(FOODS),
    'حيوانات': fourLetters(ANIMALS)
};

const LETTERS = [
    'ا','ب','ت','ث','ج','ح','خ','د','ذ','ر',
    'ز','س','ش','ص','ض','ط','ظ','ع','غ','ف',
    'ق','ك','ل','م','ن','ه','و','ي'
];

// ============================================================
// حالة اللعبة
// ============================================================
let state = {
    category:'الكل',
    word:'',
    row:0,
    cells:Array(20).fill(''),
    moves:0,
    score:0,
    wins:0,
    played:0,
    best:0,
    usedWords:[],
    keyStatus:{},
    locked:false,
    timer:null
};

// ============================================================
// دوال الحفظ والتحميل
// ============================================================
function load(){
    try{
        const data = JSON.parse(localStorage.getItem('aword_github_state') || 'null');
        if(data){
            state.wins = Number(data.wins || 0);
            state.played = Number(data.played || 0);
            state.best = Number(data.best || 0);
            state.usedWords = Array.isArray(data.usedWords) ? data.usedWords : [];
        }
    }catch(e){}
}

function save(){
    try{
        localStorage.setItem('aword_github_state',JSON.stringify({
            wins:state.wins,
            played:state.played,
            best:state.best,
            usedWords:state.usedWords
        }));
    }catch(e){}
}

// ============================================================
// دوال اللعبة الأساسية
// ============================================================
function shuffle(list){
    const a = [...list];
    for(let i=a.length-1;i>0;i--){
        const j = Math.floor(Math.random()*(i+1));
        [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
}

function chooseWord(){
    let pool = WORDS[state.category] || WORDS['الكل'];
    let available = pool.filter(w => !state.usedWords.includes(w));

    if(!available.length){
        state.usedWords = [];
        available = pool.slice();
    }

    const word = shuffle(available)[0];
    state.usedWords.push(word);
    save();
    return word;
}

// ============================================================
// دوال العرض (UI)
// ============================================================
function renderGrid(){
    const grid = document.getElementById('grid');
    grid.innerHTML = '';

    for(let i=0;i<20;i++){
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.id = 'cell-' + i;
        grid.appendChild(cell);
    }
}

function renderKeyboard(){
    const keyboard = document.getElementById('keyboard');
    keyboard.innerHTML = '';

    const rows = [
        LETTERS.slice(0,10),
        LETTERS.slice(10,20),
        LETTERS.slice(20)
    ];

    rows.forEach(row=>{
        const rowEl = document.createElement('div');
        rowEl.className = 'kb-row';

        row.forEach(letter=>{
            const key = document.createElement('button');
            key.className = 'kb-key';
            key.textContent = letter;
            key.dataset.letter = letter;
            key.addEventListener('click',function(e){
                e.preventDefault();
                pressLetter(letter);
            });
            rowEl.appendChild(key);
        });

        keyboard.appendChild(rowEl);
    });
}

function updateKeyboard(){
    document.querySelectorAll('.kb-key').forEach(key=>{
        const status = state.keyStatus[key.dataset.letter] || '';
        key.className = 'kb-key';

        if(status === 'correct') key.classList.add('used-correct');
        else if(status === 'wrong') key.classList.add('used-wrong');
        else if(status === 'present') key.classList.add('used-present');
    });
}

function updateStats(){
    const ratio = state.played
        ? (state.wins/state.played*100).toFixed(1)
        : '0.0';

    document.getElementById('win-ratio').textContent = 'نسبة الفوز: ' + ratio + '%';
    document.getElementById('win-count').textContent = 'الفوز: ' + state.wins;
    document.getElementById('games-played').textContent = 'لعبت: ' + state.played + '/3';
    document.getElementById('highest-score').textContent = 'أعلى نقاط: ' + state.best;

    document.getElementById('game-number').textContent =
        'اللعبة ' + Math.min(state.played + 1,3) + '/3';

    document.getElementById('move-count').textContent = state.moves;
    document.getElementById('score-display').textContent = state.score;
}

function updateCategory(){
    document.querySelectorAll('.cat-btn').forEach(btn=>{
        btn.classList.toggle('active',btn.dataset.cat === state.category);
    });

    document.getElementById('selected-category-label').textContent =
        'الفئة: ' + state.category;
}

function clearGrid(){
    state.cells = Array(20).fill('');
    state.row = 0;
    state.moves = 0;
    state.keyStatus = {};

    for(let i=0;i<20;i++){
        const cell = document.getElementById('cell-'+i);
        if(cell){
            cell.textContent = '';
            cell.className = 'cell';
        }
    }

    updateKeyboard();
    updateStats();
}

// ============================================================
// دوال الرسائل
// ============================================================
function showMessage(title,text,autoHide){
    document.getElementById('message-title').textContent = title;
    document.getElementById('message-sub').textContent = text || '';
    document.getElementById('message-overlay').classList.add('show');

    if(autoHide){
        clearTimeout(state.timer);
        state.timer = setTimeout(()=>{
            hideMessage();
        },autoHide);
    }
}

function hideMessage(){
    document.getElementById('message-overlay').classList.remove('show');
    clearTimeout(state.timer);
    state.timer = null;
}

// ============================================================
// منطق اللعبة
// ============================================================
function startRound(){
    state.locked = false;
    hideMessage();
    clearGrid();
    state.word = chooseWord();
    updateStats();
}

function pressLetter(letter){
    if(state.locked) return;

    const start = state.row * 4;
    const end = start + 4;

    for(let i=start;i<end;i++){
        if(!state.cells[i]){
            state.cells[i] = letter;
            const cell = document.getElementById('cell-'+i);
            if(cell) cell.textContent = letter;
            state.moves++;
            updateStats();

            if(state.cells.slice(start,end).every(Boolean)){
                checkGuess();
            }
            return;
        }
    }
}

function deleteLetter(){
    if(state.locked) return;

    const start = state.row * 4;
    const end = start + 4;

    for(let i=end-1;i>=start;i--){
        if(state.cells[i]){
            state.cells[i] = '';
            const cell = document.getElementById('cell-'+i);
            if(cell) cell.textContent = '';
            state.moves = Math.max(0,state.moves-1);
            updateStats();
            return;
        }
    }
}

function setKeyStatus(letter,status){
    const old = state.keyStatus[letter];

    if(old === 'correct') return;
    if(old === 'present' && status === 'wrong') return;

    state.keyStatus[letter] = status;
}

function checkGuess(){
    const start = state.row * 4;
    const guess = state.cells.slice(start,start+4).join('');
    const word = state.word;

    for(let i=0;i<4;i++){
        const letter = state.cells[start+i];
        const cell = document.getElementById('cell-'+(start+i));

        if(letter === word[i]){
            cell.className = 'cell green';
            setKeyStatus(letter,'correct');
        }else if(word.includes(letter)){
            cell.className = 'cell orange';
            setKeyStatus(letter,'present');
        }else{
            cell.className = 'cell gray';
            setKeyStatus(letter,'wrong');
        }
    }

    updateKeyboard();

    /* ---- فوز ---- */
    if(guess === word){
        state.locked = true;

        const points = [100,80,60,40,20][state.row] || 20;
        state.score += points;
        state.wins++;
        state.played++;

        state.best = Math.max(state.best,state.score);
        save();
        updateStats();

        if(state.played >= 3){
            showMessage(
                'انتهت الألعاب 🎉',
                'مبروك! اضغط «إعادة» لبدء 3 ألعاب جديدة.'
            );
        }else{
            showMessage(
                'صحيح! 🎉',
                'الجولة التالية بعد 3 ثوانٍ'
            );

            clearTimeout(state.timer);
            state.timer = setTimeout(()=>{
                if(state.played < 3 && !state.locked) startRound();
            },3000);
        }
        return;
    }

    /* ---- محاولة خاطئة ---- */
    state.row++;

    if(state.row >= 5){
        state.played++;
        save();
        updateStats();
        state.locked = true;

        if(state.played >= 3){
            showMessage(
                'انتهت الألعاب',
                'اضغط «إعادة» لبدء 3 ألعاب جديدة.'
            );
            return;
        }

        /* كشف الكلمة في الجولات الأولى */
        for(let i=0;i<4;i++){
            const idx = start+i;
            const cell = document.getElementById('cell-'+idx);
            if(cell){
                cell.textContent = word[i];
                cell.className = 'cell green';
            }
        }

        showMessage(
            'الكلمة الصحيحة',
            word + ' • الجولة التالية بعد 3 ثوانٍ'
        );

        clearTimeout(state.timer);
        state.timer = setTimeout(()=>{
            if(state.played < 3 && !state.locked) startRound();
        },3000);
        return;
    }

    /* ---- حاول مرة أخرى ---- */
    showMessage('حاول مرة أخرى!','أكمل التخمين في الصف التالي',1200);
}

// ============================================================
// إعادة تعيين اللعبة
// ============================================================
function resetGame(){
    clearTimeout(state.timer);

    if(state.played >= 3){
        state.wins = 0;
        state.played = 0;
        state.score = 0;
        state.best = 0;
        state.usedWords = [];
        save();
    }

    state.locked = false;
    startRound();
    updateStats();
}

// ============================================================
// اختيار الفئة
// ============================================================
function selectCategory(category){
    if(state.locked) return;

    state.category = category;
    state.usedWords = [];
    save();

    updateCategory();
    startRound();
}

// ============================================================
// تهيئة الأزرار والأحداث
// ============================================================
function init(){
    // تحميل الحالة
    load();

    if(state.played >= 3){
        state.wins = 0;
        state.played = 0;
        state.score = 0;
        state.best = 0;
        state.usedWords = [];
        save();
    }

    // رسم العناصر
    renderGrid();
    renderKeyboard();
    updateCategory();
    updateStats();

    // بدء الجولة الأولى
    startRound();

    // أحداث الأزرار
    document.getElementById('reset-btn').addEventListener('click',resetGame);

    document.getElementById('backspace-btn').addEventListener('click',function(e){
        e.preventDefault();
        deleteLetter();
    });

    document.querySelectorAll('.cat-btn').forEach(btn=>{
        btn.addEventListener('click',function(){
            selectCategory(this.dataset.cat);
        });
    });

    // زر الإغلاق
    document.getElementById('close-btn').addEventListener('click',function(){
        if(document.referrer){
            history.back();
        }else{
            showMessage('خمّن الكلمة','يمكنك إغلاق صفحة المتصفح من زر الرجوع أو X.');
            setTimeout(hideMessage,2500);
        }
    });

    // دعم لوحة المفاتيح الفعلية
    document.addEventListener('keydown',function(e){
        if(e.key === 'Backspace' || e.key === 'Delete'){
            e.preventDefault();
            deleteLetter();
        }else if(e.key === 'Enter'){
            e.preventDefault();
            // نتحقق إذا كان الصف مكتملاً
            const start = state.row * 4;
            if(state.cells.slice(start,start+4).every(Boolean)){
                checkGuess();
            }
        }else{
            const letter = e.key;
            if(LETTERS.includes(letter)){
                pressLetter(letter);
            }
        }
    });
}

// ============================================================
// تشغيل اللعبة
// ============================================================
document.addEventListener('DOMContentLoaded',init);
</script>
</body>
</html>
